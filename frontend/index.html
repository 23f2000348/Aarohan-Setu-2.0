<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarohan Setu 2.0 - Placement Portal</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/src/style.css" rel="stylesheet">
    
    <!-- Vue 3 and vue3-sfc-loader -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.8.4/dist/vue3-sfc-loader.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <!-- Main Navbar -->
        <navigation-bar :current-user="currentUser" :notifications="notifications" @logout="handleLogout" @change-view="changeView" @mark-read="markNotificationRead"></navigation-bar>
        
        <!-- Application Alerts / System Messages -->
        <div class="container my-3" v-if="alertMessage">
            <div :class="['alert', 'alert-dismissible', 'fade', 'show', alertType]" role="alert" id="system-alert">
                <i class="fa-solid fa-circle-info me-2"></i>
                <span v-html="alertMessage"></span>
                <button type="button" class="btn-close" @click="clearAlert" aria-label="Close"></button>
            </div>
        </div>
        
        <!-- Main Content Area with elegant fade transition -->
        <main class="container my-4 flex-grow-1">
            <transition name="fade" mode="out-in">
                <component 
                    :is="currentViewComponent" 
                    :current-user="currentUser" 
                    :user-profile="userProfile" 
                    :notifications="notifications"
                    @login-success="handleLoginSuccess" 
                    @change-view="changeView"
                    @trigger-alert="triggerAlert"
                    @update-profile="fetchCurrentUser"
                ></component>
            </transition>
        </main>
        
        <!-- Elegant Footer -->
        <footer class="footer py-3 mt-auto border-top">
            <div class="container text-center text-muted">
                <p class="mb-0">© 2026 Aarohan Setu 2.0. Institute Placement Cell Portal. All rights reserved.</p>
            </div>
        </footer>
    </div>
    
    <!-- Vue App Bootstrap Script -->
    <script src="/src/app.js" type="module"></script>
</body>
</html>
